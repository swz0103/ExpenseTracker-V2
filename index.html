<p>記帳本是一個在手機上記錄收支、信用卡帳單與分期、股票持股與預算的個人記帳 App。所有資料加密存放在你的手機上，沒有帳號、沒有伺服器、沒有廣告。</p>
<h2>主要功能</h2>
<ul>
<li>收入、支出、轉帳、拆分、分類、標籤與收據照片</li>
<li>信用卡帳單週期、繳款日與分期</li>
<li>台股持股、收盤價與損益</li>
<li>預算、定期收支、到期提醒</li>
<li>加密備份：存在手機，或由你選擇備份到自己的 Google 雲端硬碟</li>
</ul>
