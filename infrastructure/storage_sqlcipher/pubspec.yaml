name: storage_sqlcipher
description: Single encrypted SQLite store - event journal, operation journal and outbox.
version: 0.1.0
publish_to: none
environment:
  sdk: '>=3.13.0 <4.0.0'
dependencies:
  app_core:
    path: ../../packages/app_core
  foundation_values:
    path: ../../packages/foundation_values
  sqlite3: 3.7.0
dev_dependencies:
  test: 1.32.0
hooks:
  user_defines:
    sqlite3:
      source: sqlcipher
