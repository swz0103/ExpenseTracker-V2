name: ledger_vault
description: The ledger's files on one device - the keyring next to the encrypted database, created, unlocked and updated atomically.
version: 0.1.0
publish_to: none
environment:
  sdk: '>=3.13.0 <4.0.0'
dependencies:
  backup_security:
    path: ../backup_security
  ledger_sqlcipher:
    path: ../ledger_sqlcipher
  storage_sqlcipher:
    path: ../storage_sqlcipher
dev_dependencies:
  test: 1.32.0
hooks:
  user_defines:
    sqlite3:
      source: sqlcipher
