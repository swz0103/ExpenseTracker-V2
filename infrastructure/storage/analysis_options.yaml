# Stricter than the SDK default, as for every package since the new
# architecture (ADR-0001, health check G9-16).
analyzer:
  language:
    strict-casts: true
    strict-raw-types: true
linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - cancel_subscriptions
    - close_sinks
    - only_throw_errors
    - prefer_final_fields
    - test_types_in_equals
    - unawaited_futures
