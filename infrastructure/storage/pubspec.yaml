name: storage
description: The encrypted SQLite store and the bookkeeping projections kept in it.
version: 0.1.0
publish_to: none
environment:
  sdk: '>=3.13.0 <4.0.0'
dependencies:
  core:
    path: ../../packages/core
  domain:
    path: ../../packages/domain
  sqlite3: 3.6.0
dev_dependencies:
  test: 1.32.0
hooks:
  user_defines:
    sqlite3:
      source: sqlcipher
