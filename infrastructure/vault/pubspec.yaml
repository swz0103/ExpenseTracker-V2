name: vault
description: "Keys, the vault that opens the ledger, and encrypted backups."
version: 0.1.0
publish_to: none
environment:
  sdk: '>=3.13.0 <4.0.0'
dependencies:
  cryptography: 2.9.0
  storage:
    path: ../storage
  unorm_dart: 0.3.2
dev_dependencies:
  sqlite3: 3.6.0
  test: 1.33.0
hooks:
  user_defines:
    sqlite3:
      source: sqlcipher
