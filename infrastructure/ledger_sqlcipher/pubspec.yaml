name: ledger_sqlcipher
description: SQLCipher projections for bookkeeping - accounts, postings, balances and monthly totals.
version: 0.1.0
publish_to: none
environment:
  sdk: '>=3.13.0 <4.0.0'
dependencies:
  accounts:
    path: ../../packages/accounts
  app_core:
    path: ../../packages/app_core
  bookkeeping:
    path: ../../packages/bookkeeping
  categories:
    path: ../../packages/categories
  credit_cards:
    path: ../../packages/credit_cards
  foundation_values:
    path: ../../packages/foundation_values
  investments:
    path: ../../packages/investments
  ledger:
    path: ../../packages/ledger
  merchants:
    path: ../../packages/merchants
  storage_sqlcipher:
    path: ../storage_sqlcipher
  tags:
    path: ../../packages/tags
dev_dependencies:
  test: 1.32.0
hooks:
  user_defines:
    sqlite3:
      source: sqlcipher
