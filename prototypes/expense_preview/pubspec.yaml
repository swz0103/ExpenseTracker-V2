name: expense_preview
description: ExpenseTracker V2 可安裝最小記帳試用版，非正式發版。
publish_to: none
version: 0.17.0+21
environment:
  sdk: ^3.13.4
dependencies:
  amount_input:
    path: ../../packages/amount_input
  cryptography: 2.9.0
  entry_drafts:
    path: ../../packages/entry_drafts
  data_exchange:
    path: ../../packages/data_exchange
  tags:
    path: ../../packages/tags
  merchants:
    path: ../../packages/merchants
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: 0.20.3
  flutter_secure_storage: 11.2.0
  path_provider: 2.1.6
  accounts:
    path: ../../packages/accounts
  categories:
    path: ../../packages/categories
  budgets:
    path: ../../packages/budgets
  recurring_transactions:
    path: ../../packages/recurring_transactions
  credit_cards:
    path: ../../packages/credit_cards
  investments:
    path: ../../packages/investments
  market_data:
    path: ../../packages/market_data
  foundation_values:
    path: ../../packages/foundation_values
  ledger:
    path: ../../packages/ledger
  reports:
    path: ../../packages/reports
  android_foundation:
    path: ../android_foundation
  ledger_generation_probe:
    path: ../ledger_generation
  storage_generation_probe:
    path: ../storage_generation
  backup_envelope_probe:
    path: ../backup_envelope
  cloud_backup_probe:
    path: ../cloud_backup
  validated_restore_probe:
    path: ../validated_restore
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
flutter:
  generate: true
  uses-material-design: true
hooks:
  user_defines:
    sqlite3:
      source: sqlcipher
