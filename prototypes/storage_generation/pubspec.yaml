name: storage_generation_probe
description: Encrypted fixture generation and key-slot publication prototype.
publish_to: none
environment:
  sdk: '>=3.13.0 <4.0.0'
dependencies:
  crypto: 3.0.7
  sqlite3: 3.6.0
  foundation_values:
    path: ../../packages/foundation_values
  encrypted_storage_probe:
    path: ../encrypted_storage
dev_dependencies:
  test: 1.32.0
hooks:
  user_defines:
    sqlite3:
      source: sqlcipher
