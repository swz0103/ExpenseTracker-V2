# Weekly updates: the actions (pinned by commit, so each update is a
# reviewed change) and the Dart packages' dependencies, each kind in one
# pull request a week (the packages share versions, and the lockfile check
# wants them moved together). Every update has to pass the same checks;
# nothing merges by itself.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: pub
    directories:
      - /apps/expense_tracker
      - /packages/core
      - /packages/domain
      - /infrastructure/market
      - /infrastructure/storage
      - /infrastructure/vault
    schedule:
      interval: weekly
    groups:
      dart:
        patterns: ['*']
    open-pull-requests-limit: 2
