name: Emulator timings

# Runs the app in profile mode on an Android emulator and prints how long
# loading three years of entries takes (3,600 and 10,000 of them) and how
# smooth scrolling and switching pages and months are
# (integration_test/bench_test.dart). An emulator is
# not a phone: the figures are for spotting a slow-down between changes.
# It also runs the Android side's tests on the emulator (src/androidTest).
# Too slow for every pull request: it runs on demand, on a pull request
# that changes the Android side, and after a change to main where speed is
# decided.
on:
  push:
    branches: [main]
    # Where speed is decided: the model, the store and the bench itself.
    paths:
      - '.github/workflows/emulator.yml'
      - 'apps/expense_tracker/integration_test/**'
      - 'apps/expense_tracker/lib/src/core/ledger/**'
      - 'apps/expense_tracker/android/**'
      - 'infrastructure/**'
      - 'packages/**'
  # A change to the Android side runs its tests on the emulator before it
  # is merged.
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/emulator.yml'
      - 'apps/expense_tracker/android/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: emulator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  timings:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Add the test packages
        # The only resolve outside the lockfile, on purpose: integration_test
        # and flutter_driver come with the Flutter SDK and pin their own
        # dependencies (vm_service, webdriver, ...) to it. Kept out of
        # pubspec.yaml so the app's lockfile, which every other workflow
        # enforces, does not carry them. The locked resolve comes first, so
        # pub add only moves a version where the SDK's packages require it.
        working-directory: apps/expense_tracker
        run: |
          flutter config --no-analytics
          flutter pub get --enforce-lockfile
          flutter pub add 'dev:integration_test:{"sdk":"flutter"}' \
            'dev:flutter_driver:{"sdk":"flutter"}'
      - name: Run on the emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          cores: 4
          ram-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          working-directory: apps/expense_tracker
          # The bench, then the Android side's own tests on the phone itself:
          # the Keystore, notifications and photos (android/app/src/androidTest).
          script: |
            flutter drive --profile --driver=test_driver/integration_test.dart --target=integration_test/bench_test.dart --no-dds
            cd android && ./gradlew --no-daemon --console=plain :app:connectedDebugAndroidTest
      - name: Timings
        if: always()
        working-directory: apps/expense_tracker
        run: |
          python3 - <<'PY'
          import json, pathlib
          path = pathlib.Path('build/integration_response_data.json')
          if not path.exists():
              raise SystemExit('No timings were written.')
          data = json.loads(path.read_text())
          print(json.dumps(data, ensure_ascii=False, indent=1))
          lines = ['| 項目 | 數值 |', '|---|---|']
          # The plain figures first (entries, write, load, month, reports,
          # save; 10k_ for ten thousand entries), then the frame timings.
          for key, value in data.items():
              if not isinstance(value, dict):
                  lines.append(f'| {key} | {value} |')
          for key, value in data.items():
              if isinstance(value, dict):
                  lines.append(
                      f"| {key} | build 平均 {value.get('average_frame_build_time_millis', 0):.1f} ms、"
                      f"90% {value.get('90th_percentile_frame_build_time_millis', 0):.1f} ms、"
                      f"最慢 {value.get('worst_frame_build_time_millis', 0):.1f} ms；"
                      f"raster 平均 {value.get('average_frame_rasterizer_time_millis', 0):.1f} ms、"
                      f"90% {value.get('90th_percentile_frame_rasterizer_time_millis', 0):.1f} ms；"
                      f"掉格 {value.get('missed_frame_build_budget_count', 0)}/"
                      f"{value.get('frame_count', 0)} |"
                  )
          text = '\n'.join(lines)
          print(text)
          import os
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(text + '\n')
          PY

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: emulator-benchmark-${{ github.run_id }}
          path: apps/expense_tracker/build/integration_response_data.json
          if-no-files-found: warn
          retention-days: 30
