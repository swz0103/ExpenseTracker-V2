name: Android APK

# Builds the phone app. On main it waits for the push's own validation run
# (integration-validation.yml) and, once that passed, builds the same commit
# and puts the APK on the release `android-latest`, where it can be
# downloaded; validation runs once per push. Pull requests only check that
# it builds, in parallel with their own validation run.
on:
  workflow_run:
    workflows: ['V2 integration validation']
    types: [completed]
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/android.yml'
      - 'apps/**'
      - 'infrastructure/**'
      - 'packages/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    # From validation: only a push to main whose whole validation set
    # passed. Manual runs and pull requests only build.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      # The commit validated (workflow_run), or the one this run is on.
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.workflow_run.head_sha || '' }}
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      # Gradle's downloads and build cache; v4.3.0.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('apps/expense_tracker/android/**/*.gradle*', 'apps/expense_tracker/android/**/gradle-wrapper.properties', 'apps/expense_tracker/android/gradle.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-
      - name: Signing key
        # The release key from repository secrets (docs/STATUS.md); without
        # them the APK is signed with a debug key, for trying it out only.
        env:
          KEYSTORE: ${{ secrets.ANDROID_PREVIEW_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_PREVIEW_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_PREVIEW_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_PREVIEW_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE" ]; then
            # A release signed with a passing key could not update the one
            # people have installed: main refuses to publish one.
            if [ "$GITHUB_REF" = 'refs/heads/main' ]; then
              echo '::error::No signing secrets: main only publishes APKs signed with the release key.'
              exit 1
            fi
            echo 'No signing secrets: this check builds a debug-signed APK.'
            exit 0
          fi
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > apps/expense_tracker/android/key.properties
      - name: Build the APK
        working-directory: apps/expense_tracker
        run: |
          flutter config --no-analytics
          flutter pub get --enforce-lockfile
          # Phones in use are 64-bit ARM: one architecture keeps the download
          # near 28 MB instead of 78 MB. Symbols stay out of the APK.
          flutter build apk --release --build-number=${{ github.run_number }} \
            --target-platform android-arm64 \
            --split-debug-info="$RUNNER_TEMP/symbols"
          cp build/app/outputs/flutter-apk/app-release.apk \
            "$RUNNER_TEMP/ExpenseTracker.apk"
      - name: Keep the debug symbols
        # Turns a crash's stack trace from this build back into names
        # (flutter symbolize). v4.6.2.
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: symbols-${{ env.SOURCE_SHA }}
          path: ${{ runner.temp }}/symbols
          if-no-files-found: error
          retention-days: 90
      - name: Publish on the android-latest release
        # Only a validated push to main is published.
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          if ! gh release view android-latest --repo "$repo" > /dev/null 2>&1; then
            gh release create android-latest --repo "$repo" --prerelease \
              --target "$SOURCE_SHA" --title '記帳本 Android 最新版' \
              --notes '從 main 最新一次建置的安裝檔。'
          fi
          gh release upload android-latest "$RUNNER_TEMP/ExpenseTracker.apk" \
            --repo "$repo" --clobber
          gh release edit android-latest --repo "$repo" \
            --notes "從 main 的 ${SOURCE_SHA:0:7} 建置。下載 ExpenseTracker.apk，在手機上開啟安裝。"
