name: Android APK

# Builds the phone app. On main it waits for the push's own validation run
# (integration-validation.yml) and, once that passed, builds the same commit
# and publishes the APK on the version's own release, `v<version>`,
# marked the latest, where it can be downloaded; validation runs once per
# push. Pull requests and manual runs only check that it builds, signed
# with the debug key.
#
# Four jobs, each with only what it needs: `build` reads the repository
# and never sees the signing key (the build runs Gradle plugins and
# packages' code); `sign` sees only the key and the built APK, and checks
# nothing out; `publish` is the only one that may write (the release).
# `sign` and `publish` run only for a validated push to main. The key is
# a secret of the GitHub Environment `release-signing` (settings of the
# repository, with required reviewers and main as the only branch), so
# only `sign` can read it, and only once approved. `play` builds the
# Google Play flavor as an App Bundle and checks that it cannot update
# itself; it is uploaded nowhere (the app is not on Google Play yet).
on:
  workflow_run:
    workflows: ['V2 integration validation']
    types: [completed]
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/android.yml'
      - 'apps/**'
      - 'infrastructure/**'
      - 'packages/**'
  workflow_dispatch:

permissions:
  contents: read

# No workflow-level concurrency: every validation that completes starts a
# run here, even a failed or skipped one, and a workflow-wide group would
# let such a run cancel a publish half way. Each job sets its own group.

jobs:
  build:
    # From validation: only a push to main whose whole validation set
    # passed. Manual runs and pull requests only build.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    # A newer push to a pull request cancels its older build. Builds of
    # main queue one after another (never cancelled while running), so
    # their publishes happen in commit order; manual runs stand alone.
    concurrency:
      group: >-
        ${{ github.event_name == 'pull_request' && format('android-pr-{0}', github.ref) ||
        github.event_name == 'workflow_run' && 'android-main-build' ||
        format('android-manual-{0}', github.run_id) }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    env:
      # The commit actually checked out and built: the validated commit
      # (workflow_run), otherwise the run's own commit (for a pull request,
      # the merge commit GitHub tests).
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      # Gradle's downloads and build cache; v6.1.0.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('apps/expense_tracker/android/**/*.gradle*', 'apps/expense_tracker/android/**/gradle-wrapper.properties', 'apps/expense_tracker/android/gradle.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-
      - name: Build the APK
        working-directory: apps/expense_tracker
        run: |
          flutter config --no-analytics
          flutter pub get --enforce-lockfile
          # 設定 › 關於 shows which build this is.
          version=$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)
          # Phones in use are 64-bit ARM: one architecture keeps the download
          # near 28 MB instead of 78 MB. Symbols stay out of the APK.
          # The sideload flavor is the one published here (it updates
          # itself); `play` is built by its own job below. A release build
          # without the release key fails unless asked for: this one is
          # debug-signed on purpose, and `sign` re-signs it.
          flutter build apk --release --flavor sideload \
            -PallowDebugSignedRelease=true \
            --build-number=${{ github.run_number }} \
            --dart-define=APP_VERSION="$version" \
            --dart-define=APP_BUILD=${{ github.run_number }} \
            --dart-define=APP_COMMIT="${SOURCE_SHA:0:7}" \
            --target-platform android-arm64 \
            --split-debug-info="$RUNNER_TEMP/symbols"
          # Signed with the debug key here; `sign` puts the release key on
          # it for main.
          cp build/app/outputs/flutter-apk/app-sideload-release.apk \
            "$RUNNER_TEMP/ExpenseTracker.apk"
          # The sideload build must still be able to install its updates.
          aapt2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          if ! "$aapt2" dump permissions "$RUNNER_TEMP/ExpenseTracker.apk" |
              grep -q 'android.permission.REQUEST_INSTALL_PACKAGES'; then
            echo '::error::The sideload APK lost REQUEST_INSTALL_PACKAGES: it could not update itself.'
            exit 1
          fi
          echo "$version" > "$RUNNER_TEMP/version.txt"
          # What this version changes, shown before updating (whats_new.txt).
          cp whats_new.txt "$RUNNER_TEMP/whats_new.txt"
      - name: Make the test backup
        # The test ledger's backup (tool/test_ledger.py, password test1234),
        # published beside the APK for trying the app with real-looking data.
        working-directory: apps/expense_tracker
        env:
          TEST_BACKUP_OUT: ${{ runner.temp }}/test-ledger.etbk
        run: |
          flutter test test/tool/test_ledger_test.dart
          test -s "$TEST_BACKUP_OUT"
      - name: Kotlin unit tests
        # The Android side's own checks, such as the inbox sealing the
        # vault's worked example the same (InboxWriterTest.kt). The Android
        # build tools make unit tests for the debug build only; the update
        # checks (UpdateGateTest.kt) belong to the sideload flavor.
        working-directory: apps/expense_tracker/android
        run: ./gradlew --no-daemon --quiet :app:testSideloadDebugUnitTest :app:testPlayDebugUnitTest
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Open the APK on an emulator
        # The release build itself, shrunk by R8, opened, sent to the
        # background and opened again: a build that stops as it opens (as
        # one did when R8 removed WorkManager's database) fails here rather
        # than on a phone. The emulator runs the arm64 APK through Android's
        # translation.
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          cores: 4
          ram-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash "$GITHUB_WORKSPACE/.github/scripts/launch-check.sh" "$RUNNER_TEMP/ExpenseTracker.apk"
      - name: Check 16 KB page alignment
        # Phones with 16 KB memory pages (Android 15 and later) load only
        # native libraries whose LOAD segments are aligned to 16 KB, kept
        # uncompressed at 16 KB boundaries in the APK; Google Play requires
        # it too. Checked on every build so a dependency cannot slip it in.
        run: |
          set -euo pipefail
          apk="$RUNNER_TEMP/ExpenseTracker.apk"
          zipalign=$(ls "$ANDROID_HOME"/build-tools/*/zipalign | sort -V | tail -1)
          if ! "$zipalign" -c -P 16 -v 4 "$apk" > "$RUNNER_TEMP/zipalign.txt"; then
            grep -v 'OK' "$RUNNER_TEMP/zipalign.txt" | tail -20
            echo "::error::The APK is not aligned for 16 KB pages."
            exit 1
          fi
          libs="$RUNNER_TEMP/libs"
          mkdir -p "$libs"
          unzip -q -o "$apk" 'lib/*' -d "$libs"
          bad=0
          while IFS= read -r so; do
            for align in $(readelf -lW "$so" | awk '$1 == "LOAD" { print $NF }' | sort -u); do
              if [ $((align)) -lt 16384 ]; then
                echo "::error::${so#"$libs"/} has a LOAD segment aligned to $align."
                bad=1
              fi
            done
            echo "${so#"$libs"/}: OK"
          done < <(find "$libs" -name '*.so')
          exit "$bad"
      - name: Keep the debug symbols
        # Turns a crash's stack trace from this build back into names
        # (flutter symbolize). v7.0.2.
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: symbols-${{ env.SOURCE_SHA }}
          path: ${{ runner.temp }}/symbols
          if-no-files-found: error
          retention-days: 90
      - name: Hand the APK to the sign job
        # Also kept for a pull request: its APK, signed with the debug key,
        # can be tried out. v7.0.2.
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: apk-unsigned
          path: |
            ${{ runner.temp }}/ExpenseTracker.apk
            ${{ runner.temp }}/version.txt
            ${{ runner.temp }}/whats_new.txt
            ${{ runner.temp }}/test-ledger.etbk
          if-no-files-found: error
          retention-days: 3

  play:
    # The play flavor, for Google Play: an App Bundle, built unsigned of
    # any release key (debug-signed, on purpose) and kept nowhere. It
    # checks what Google Play would reject: the bundle asks for no
    # REQUEST_INSTALL_PACKAGES and holds none of the self-update code.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    concurrency:
      group: >-
        ${{ github.event_name == 'pull_request' && format('android-play-pr-{0}', github.ref) ||
        format('android-play-{0}', github.run_id) }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      # Gradle's downloads and build cache; v6.1.0.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('apps/expense_tracker/android/**/*.gradle*', 'apps/expense_tracker/android/**/gradle-wrapper.properties', 'apps/expense_tracker/android/gradle.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-
      - name: Build the App Bundle
        working-directory: apps/expense_tracker
        run: |
          flutter config --no-analytics
          flutter pub get --enforce-lockfile
          flutter build appbundle --release --flavor play \
            -PallowDebugSignedRelease=true \
            --build-number=${{ github.run_number }} \
            --target-platform android-arm64
      - name: The play flavor cannot update itself
        # No aapt2 on a bundle: the merged manifest Gradle made (text) and
        # the bundle's own manifest (protobuf, whose strings are plain) are
        # both searched. The permissions the app does need are looked for
        # too, so a manifest that could not be read fails rather than
        # passing as empty.
        working-directory: apps/expense_tracker
        run: |
          set -euo pipefail
          aab=build/app/outputs/bundle/playRelease/app-play-release.aab
          merged=build/app/intermediates/merged_manifests/playRelease/processPlayReleaseManifest/AndroidManifest.xml
          test -s "$aab"
          test -s "$merged"
          bundled="$RUNNER_TEMP/bundle-manifest.bin"
          unzip -p "$aab" base/manifest/AndroidManifest.xml > "$bundled"
          for manifest in "$merged" "$bundled"; do
            grep -aq 'android.permission.INTERNET' "$manifest" || {
              echo "::error::$manifest could not be read (no INTERNET permission in it)."
              exit 1
            }
            if grep -aq 'REQUEST_INSTALL_PACKAGES' "$manifest"; then
              echo "::error::$manifest asks for REQUEST_INSTALL_PACKAGES: Google Play rejects an app that installs packages itself."
              exit 1
            fi
          done
          # Nor the installer's channel method or the update feed's address
          # in the code.
          if unzip -p "$aab" 'base/dex/*.dex' | grep -aq 'installApk\|releases/latest/download/update.json'; then
            echo '::error::The play bundle still holds the self-update code.'
            exit 1
          fi
      - name: About shows no update in the play flavor
        working-directory: apps/expense_tracker
        run: flutter test --flavor play test/app/about_flavor_test.dart

  sign:
    # The release key goes on the APK the build made, in a job that checks
    # nothing out and runs nothing from the repository or its packages.
    needs: build
    if: github.event_name == 'workflow_run'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The key lives in this Environment's secrets, not the repository's:
    # the owner makes it in the repository's settings (Environments), with
    # required reviewers and a deployment branch rule for main, and moves
    # the four ANDROID_PREVIEW_* secrets into it.
    environment: release-signing
    permissions:
      contents: read
    concurrency:
      group: android-sign-${{ github.run_id }}
    env:
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      # v8.0.2.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: apk-unsigned
          path: ${{ runner.temp }}/apk
      - name: Sign with the release key
        env:
          KEYSTORE: ${{ secrets.ANDROID_PREVIEW_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_PREVIEW_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_PREVIEW_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_PREVIEW_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE" ]; then
            # A release signed with a passing key could not update the one
            # people have installed: main refuses to publish one.
            echo '::error::No signing secrets: main only publishes APKs signed with the release key.'
            exit 1
          fi
          key="$RUNNER_TEMP/release.jks"
          trap 'rm -f "$key"' EXIT
          echo "$KEYSTORE" | base64 -d > "$key"
          tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          apk="$RUNNER_TEMP/apk/ExpenseTracker.apk"
          # Replaces the debug signature; the 16 KB alignment the build
          # checked is kept (apksigner does not move entries).
          "$tools/apksigner" sign --ks "$key" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:STORE_PASSWORD --key-pass env:KEY_PASSWORD "$apk"
          certs=$("$tools/apksigner" verify --print-certs "$apk")
          echo "$certs"
          if grep -qi 'CN=Android Debug' <<< "$certs"; then
            echo '::error::The APK still carries the debug key.'
            exit 1
          fi
          "$tools/zipalign" -c -P 16 4 "$apk"
          # What the app reads to update itself (app_update.dart): this
          # build's number, its SHA-256 and size, and what it changes, a few
          # lines shown before updating; published beside the APK.
          jq -n \
            --argjson build "${{ github.run_number }}" \
            --arg version "$(cat "$RUNNER_TEMP/apk/version.txt")" \
            --arg commit "${SOURCE_SHA:0:7}" \
            --arg sha256 "$(sha256sum "$apk" | cut -d' ' -f1)" \
            --argjson size "$(stat -c %s "$apk")" \
            --rawfile notes "$RUNNER_TEMP/apk/whats_new.txt" \
            '{build: $build, version: $version, commit: $commit, sha256: $sha256,
              size: $size, notes: ($notes | split("\n") | map(select(length > 0)))}' \
            > "$RUNNER_TEMP/apk/update.json"
          cat "$RUNNER_TEMP/apk/update.json"
      - name: Hand the APK to the publish job
        # v7.0.2.
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: apk
          path: |
            ${{ runner.temp }}/apk/ExpenseTracker.apk
            ${{ runner.temp }}/apk/update.json
            ${{ runner.temp }}/apk/test-ledger.etbk
          if-no-files-found: error
          retention-days: 3

  publish:
    # Only a validated push to main is published, and only once signed and
    # once the play flavor has passed too (nothing of it is published).
    needs: [sign, play]
    if: github.event_name == 'workflow_run'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    # One publish at a time and never cancelled by a later run: a run that
    # starts while this one works waits for it. Only the newest waiting
    # run is kept, which is the one to publish anyway.
    concurrency:
      group: android-publish
      cancel-in-progress: false
    env:
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      # v8.0.2.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: apk
          path: ${{ runner.temp }}/apk
      - name: Tag the version
        # The version gets a tag of its own, v<version>, on the first build
        # published as it: the code behind the APK. It is never moved, and
        # no release or tag is ever deleted: every version stays on the
        # releases page, so a bad one can be rolled back to the one before
        # (the app reads releases/latest, which is the newest). The
        # books and backups each version writes are kept in the repository
        # (test/fixtures/books, docs/adr/0010-data-that-lasts.md).
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          version="$(jq -r .version "$RUNNER_TEMP/apk/update.json")"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Not a version to tag: '$version'."
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          if gh api "repos/$repo/git/ref/tags/v$version" > /dev/null 2>&1; then
            echo "v$version is already tagged; it stays where it is."
          else
            gh api -X POST "repos/$repo/git/refs" \
              -f ref="refs/tags/v$version" -f sha="$SOURCE_SHA" > /dev/null
            echo "Tagged v$version at ${SOURCE_SHA:0:7}."
          fi
      - name: Publish the version's release
        # One release a version, v<version>, made once with its APK
        # (ExpenseTracker-<version>.apk), update.json and the test ledger,
        # and marked the latest: the app reads update.json from
        # releases/latest and downloads the APK the version names. Every
        # PR that ships raises the version (ADR-0011), so a version already
        # released is a re-run and is left as it is.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          tag="v$VERSION"
          apk="ExpenseTracker-$VERSION.apk"
          if gh release view "$tag" --repo "$repo" --json assets \
              --jq '.assets[].name' 2> /dev/null | grep -qx "$apk"; then
            echo "$tag is already released with $apk; it stays as it is."
            exit 0
          fi
          cp "$RUNNER_TEMP/apk/ExpenseTracker.apk" "$RUNNER_TEMP/$apk"
          sum=$(sha256sum "$RUNNER_TEMP/$apk" | cut -d' ' -f1)
          notes="$(jq -r '.notes | map("- " + .) | join("\n")' "$RUNNER_TEMP/apk/update.json")

          從 ${SOURCE_SHA:0:7} 建置。下載 \`$apk\`，在手機上開啟安裝。

          SHA-256：\`$sum\`"
          if ! gh release view "$tag" --repo "$repo" > /dev/null 2>&1; then
            # A draft until every file is on it, so no one, the app
            # included, finds the release without its APK.
            gh release create "$tag" --repo "$repo" --verify-tag --draft \
              --title "記帳本 $VERSION" --notes "$notes"
          fi
          gh release upload "$tag" --repo "$repo" --clobber \
            "$RUNNER_TEMP/$apk" \
            "$RUNNER_TEMP/apk/update.json" \
            "$RUNNER_TEMP/apk/test-ledger.etbk"
          gh release edit "$tag" --repo "$repo" --draft=false --latest \
            --notes "$notes"
