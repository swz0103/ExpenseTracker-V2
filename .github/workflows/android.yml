name: Android APK

# Builds the phone app. On main it waits for the push's own validation run
# (integration-validation.yml) and, once that passed, builds the same commit
# and puts the APK on the release `android-latest`, where it can be
# downloaded; validation runs once per push. Pull requests and manual runs
# only check that it builds, signed with the debug key.
#
# Two jobs: `build` only reads the repository; `publish` is the only one
# that may write (the release) and runs only for a validated push to main.
on:
  workflow_run:
    workflows: ['V2 integration validation']
    types: [completed]
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/android.yml'
      - 'apps/**'
      - 'infrastructure/**'
      - 'packages/**'
  workflow_dispatch:

permissions:
  contents: read

# No workflow-level concurrency: every validation that completes starts a
# run here, even a failed or skipped one, and a workflow-wide group would
# let such a run cancel a publish half way. Each job sets its own group.

jobs:
  build:
    # From validation: only a push to main whose whole validation set
    # passed. Manual runs and pull requests only build.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    # A newer push to a pull request cancels its older build. Builds of
    # main queue one after another (never cancelled while running), so
    # their publishes happen in commit order; manual runs stand alone.
    concurrency:
      group: >-
        ${{ github.event_name == 'pull_request' && format('android-pr-{0}', github.ref) ||
        github.event_name == 'workflow_run' && 'android-main-build' ||
        format('android-manual-{0}', github.run_id) }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    env:
      # The commit actually checked out and built: the validated commit
      # (workflow_run), otherwise the run's own commit (for a pull request,
      # the merge commit GitHub tests).
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      # Gradle's downloads and build cache; v4.3.0.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('apps/expense_tracker/android/**/*.gradle*', 'apps/expense_tracker/android/**/gradle-wrapper.properties', 'apps/expense_tracker/android/gradle.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-
      - name: Signing key
        # Only the validated main build gets the release key from repository
        # secrets (docs/STATUS.md). Pull requests and manual runs never see
        # it and are signed with the debug key, for trying out only.
        if: github.event_name == 'workflow_run'
        env:
          KEYSTORE: ${{ secrets.ANDROID_PREVIEW_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_PREVIEW_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_PREVIEW_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_PREVIEW_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE" ]; then
            # A release signed with a passing key could not update the one
            # people have installed: main refuses to publish one.
            echo '::error::No signing secrets: main only publishes APKs signed with the release key.'
            exit 1
          fi
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > apps/expense_tracker/android/key.properties
      - name: Build the APK
        working-directory: apps/expense_tracker
        run: |
          flutter config --no-analytics
          flutter pub get --enforce-lockfile
          # 設定 › 關於 shows which build this is.
          version=$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)
          # Phones in use are 64-bit ARM: one architecture keeps the download
          # near 28 MB instead of 78 MB. Symbols stay out of the APK.
          flutter build apk --release --build-number=${{ github.run_number }} \
            --dart-define=APP_VERSION="$version" \
            --dart-define=APP_BUILD=${{ github.run_number }} \
            --dart-define=APP_COMMIT="${SOURCE_SHA:0:7}" \
            --target-platform android-arm64 \
            --split-debug-info="$RUNNER_TEMP/symbols"
          cp build/app/outputs/flutter-apk/app-release.apk \
            "$RUNNER_TEMP/ExpenseTracker.apk"
      - name: Kotlin unit tests
        # The Android side's own checks, such as the inbox sealing the
        # vault's worked example the same (InboxWriterTest.kt).
        working-directory: apps/expense_tracker/android
        run: ./gradlew --no-daemon --quiet :app:testReleaseUnitTest
      - name: Check 16 KB page alignment
        # Phones with 16 KB memory pages (Android 15 and later) load only
        # native libraries whose LOAD segments are aligned to 16 KB, kept
        # uncompressed at 16 KB boundaries in the APK; Google Play requires
        # it too. Checked on every build so a dependency cannot slip it in.
        run: |
          set -euo pipefail
          apk="$RUNNER_TEMP/ExpenseTracker.apk"
          zipalign=$(ls "$ANDROID_HOME"/build-tools/*/zipalign | sort -V | tail -1)
          if ! "$zipalign" -c -P 16 -v 4 "$apk" > "$RUNNER_TEMP/zipalign.txt"; then
            grep -v 'OK' "$RUNNER_TEMP/zipalign.txt" | tail -20
            echo "::error::The APK is not aligned for 16 KB pages."
            exit 1
          fi
          libs="$RUNNER_TEMP/libs"
          mkdir -p "$libs"
          unzip -q -o "$apk" 'lib/*' -d "$libs"
          bad=0
          while IFS= read -r so; do
            for align in $(readelf -lW "$so" | awk '$1 == "LOAD" { print $NF }' | sort -u); do
              if [ $((align)) -lt 16384 ]; then
                echo "::error::${so#"$libs"/} has a LOAD segment aligned to $align."
                bad=1
              fi
            done
            echo "${so#"$libs"/}: OK"
          done < <(find "$libs" -name '*.so')
          exit "$bad"
      - name: Remove the signing key
        if: always() && github.event_name == 'workflow_run'
        run: rm -f "$RUNNER_TEMP/release.jks" apps/expense_tracker/android/key.properties
      - name: Keep the debug symbols
        # Turns a crash's stack trace from this build back into names
        # (flutter symbolize). v4.6.2.
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: symbols-${{ env.SOURCE_SHA }}
          path: ${{ runner.temp }}/symbols
          if-no-files-found: error
          retention-days: 90
      - name: Hand the APK to the publish job
        if: github.event_name == 'workflow_run'
        # v4.6.2.
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: apk
          path: ${{ runner.temp }}/ExpenseTracker.apk
          if-no-files-found: error
          retention-days: 3

  publish:
    # Only a validated push to main is published, and only after its build.
    needs: build
    if: github.event_name == 'workflow_run'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    # One publish at a time and never cancelled by a later run: a run that
    # starts while this one works waits for it. Only the newest waiting
    # run is kept, which is the one to publish anyway.
    concurrency:
      group: android-publish
      cancel-in-progress: false
    env:
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      # v4.3.0.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: apk
          path: ${{ runner.temp }}/apk
      - name: Publish on the android-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          if ! gh release view android-latest --repo "$repo" > /dev/null 2>&1; then
            gh release create android-latest --repo "$repo" --prerelease \
              --target "$SOURCE_SHA" --title '記帳本 Android 最新版' \
              --notes '從 main 最新一次建置的安裝檔。'
          fi
          # Upload the new APK under a name of its own first, so the release
          # is never left without an APK: only then remove the old one and
          # give the new one the usual name.
          staged="ExpenseTracker-$GITHUB_RUN_ID.apk"
          cp "$RUNNER_TEMP/apk/ExpenseTracker.apk" "$RUNNER_TEMP/$staged"
          gh release upload android-latest "$RUNNER_TEMP/$staged" --repo "$repo"
          asset_id() {
            gh api "repos/$repo/releases/tags/android-latest" \
              --jq ".assets[] | select(.name == \"$1\") | .id"
          }
          new_id="$(asset_id "$staged")"
          if [ -z "$new_id" ]; then
            echo "::error::Uploaded $staged but cannot find it on the release."
            exit 1
          fi
          old_id="$(asset_id ExpenseTracker.apk)"
          if [ -n "$old_id" ]; then
            gh api -X DELETE "repos/$repo/releases/assets/$old_id"
          fi
          gh api -X PATCH "repos/$repo/releases/assets/$new_id" \
            -f name=ExpenseTracker.apk > /dev/null
          # Leftovers from an earlier publish that stopped half way.
          gh api "repos/$repo/releases/tags/android-latest" \
            --jq '.assets[] | select(.name | test("^ExpenseTracker-[0-9]+\\.apk$")) | .id' |
            while read -r id; do
              gh api -X DELETE "repos/$repo/releases/assets/$id"
            done
          # The tag follows the release: it names the commit this APK was
          # built from, not the one the release was first made on.
          gh api -X PATCH "repos/$repo/git/refs/tags/android-latest" \
            -f sha="$SOURCE_SHA" -F force=true > /dev/null
          sum=$(sha256sum "$RUNNER_TEMP/apk/ExpenseTracker.apk" | cut -d' ' -f1)
          gh release edit android-latest --repo "$repo" \
            --notes "從 main 的 ${SOURCE_SHA:0:7} 建置。下載 ExpenseTracker.apk，在手機上開啟安裝。

          SHA-256：\`$sum\`"
