name: Supply chain

# Known vulnerabilities and licenses of every locked dependency (code audit
# M-02). Runs when a lockfile changes, and weekly, because new advisories
# appear without any change here.
on:
  pull_request:
    branches: [main]
    paths:
      - '**/pubspec.lock'
      - '.github/workflows/supply-chain.yml'
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  osv:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # v2.6.0
      - uses: google/osv-scanner-action/osv-scanner-action@a345acffa64b0eaede81a3d9aae6141214d9c8fc
        with:
          scan-args: |-
            --licenses
            --recursive
            ./
