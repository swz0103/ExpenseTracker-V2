name: Android foundation host checks

on:
  # Budget mode: local checks are the default. See docs/delivery/ci-budget-policy.md.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  flutter-host:
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      matrix:
        package: [prototypes/android_foundation, prototypes/expense_preview]
    defaults:
      run:
        working-directory: ${{ matrix.package }}
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.5'
          channel: stable
          # Both matrix entries use the same SDK/pub keys. One writer avoids
          # duplicate compression/upload and cache reservation races.
          cache: ${{ matrix.package == 'prototypes/expense_preview' }}
      - run: flutter config --no-analytics
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib test
      - if: matrix.package == 'prototypes/android_foundation'
        run: dart format --output=none --set-exit-if-changed integration_test
      - if: matrix.package == 'prototypes/expense_preview'
        run: dart format --output=none --set-exit-if-changed tool
      - run: flutter analyze
      - run: flutter test --reporter expanded
      # Device integration is a separate gate; these host checks do not run it.
