name: V2 web preview

# Builds the new app for the browser. A build of main is stored under
# refs/previews/web (not a branch), where it is picked up and published as a
# private page; a pull request's build is only kept as a workflow artifact,
# so it never replaces the preview of main. Nothing here signs, releases or
# touches main.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/web-preview.yml'
      - 'apps/**'
      - 'infrastructure/**'
      - 'packages/**'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/web-preview.yml'
      - 'apps/**'
      - 'infrastructure/**'
      - 'packages/**'
  workflow_dispatch:

permissions:
  contents: read

# One group per ref: a pull request never cancels the build from main.
concurrency:
  group: web-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Only builds from this repository run here.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          # The build runs package hooks; keep the write token out of
          # .git/config so only the final push step can use it (G9-14).
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Build for the browser
        working-directory: apps/expense_tracker
        run: |
          flutter config --no-analytics
          flutter pub get --enforce-lockfile
          # Bundle CanvasKit so the page needs no Google CDN.
          flutter build web --release --no-web-resources-cdn --no-source-maps \
            -t lib/main_preview.dart
      - name: Keep a build not from main
        if: github.ref != 'refs/heads/main'
        # v4.6.2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: web-preview
          path: apps/expense_tracker/build/web
          if-no-files-found: error
          retention-days: 7
      - name: Store the build under refs/previews/web
        # Only main's build is the preview; other builds are kept above.
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/preview"
          cp -r apps/expense_tracker/build/web "$out"
          cd "$out"
          git init -q
          git config user.name 'web-preview'
          git config user.email 'web-preview@users.noreply.github.com'
          git add -A
          git commit -q -m "Web preview of $SOURCE_SHA"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:refs/previews/web
