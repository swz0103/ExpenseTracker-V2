name: Foundation probe

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  foundation-values:
    runs-on: windows-latest
    strategy:
      matrix:
        package: [packages/foundation_values, packages/accounts, packages/ledger, prototypes/modular_persistence, prototypes/backup_envelope, prototypes/validated_restore, prototypes/encrypted_storage]
    defaults:
      run:
        working-directory: ${{ matrix.package }}
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d
        with:
          sdk: '3.13.4'
      - run: dart pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: dart analyze
      - if: matrix.package == 'prototypes/validated_restore'
        run: |
          dart format --output=none --set-exit-if-changed bin
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dart build cli --target bin/restore_worker.dart --output .dart_tool/worker
      - if: matrix.package == 'prototypes/encrypted_storage'
        run: |
          dart format --output=none --set-exit-if-changed bin
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dart build cli --target bin/restore_worker.dart --output .dart_tool/worker
      - run: dart test --reporter expanded
  transaction-boundary:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: prototypes/transaction_boundary
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
        with:
          sdk: '3.13.4'
      - run: dart pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib bin test
      - run: dart analyze
      - run: dart build cli --target bin/worker.dart --output .dart_tool/worker
      - run: dart test --reporter expanded
