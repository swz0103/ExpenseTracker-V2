name: V2 integration validation

# Keep the complete validation set on the single default delivery branch.
# Each push to main runs it once; the Android release (android.yml) waits
# for this run to pass instead of running its own copy.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'apps/**'
      - 'infrastructure/**'
      - 'packages/**'
      - 'tooling/**'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'apps/**'
      - 'infrastructure/**'
      - 'packages/**'
      - 'tooling/**'
  workflow_dispatch:

permissions:
  contents: read

# A push to main never cancels a validation that is already running; it
# waits for it. GitHub keeps only one waiting run per group, though: when
# several pushes land during one run, the older waiting ones are cancelled
# and only the newest is validated (and so published by android.yml), so a
# commit in the middle of a burst can be left without a result. Pull
# requests and manual runs each get a group of their own.
concurrency:
  group: v2-integration-validation-${{ github.event_name }}-${{ github.event_name == 'push' && github.ref || github.run_id }}
  cancel-in-progress: false

jobs:
  # Every pure Dart package in one job: one checkout, one SDK and one pub
  # cache instead of three.
  dart:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # Nothing here pushes: no token is left in .git/config.
          persist-credentials: false
      - name: The version never goes down
        # A pull request may keep the version: it is then merged without
        # being published, and waits for the next one that raises it
        # (docs/adr/0011-version-numbers.md). A version changed must go up.
        # Read from the API: nothing of main needs checking out.
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          version() { sed -n 's/^version: *\([0-9.]*\).*/\1/p'; }
          before=$(gh api "repos/$REPO/contents/apps/expense_tracker/pubspec.yaml?ref=$BASE" \
            --jq .content | base64 -d | version)
          now=$(version < apps/expense_tracker/pubspec.yaml)
          if [ "$now" = "$before" ]; then
            echo "Version stays at $now: merged without a release."
            exit 0
          fi
          higher=$(printf '%s\n%s\n' "$before" "$now" | sort -V | tail -1)
          if [ "$higher" != "$now" ]; then
            echo "::error::Version $now is lower than main's $before."
            exit 1
          fi
          echo "Version $before -> $now: published once merged."
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d
        with:
          sdk: '3.13.4'
      # v6.1.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-dart-3.13.4-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-dart-3.13.4-
      - shell: pwsh
        run: |
          $packages = @(
            'tooling/architecture_checks',
            'packages/core',
            'packages/domain',
            'infrastructure/storage',
            'infrastructure/vault',
            'infrastructure/market'
          )
          foreach ($package in $packages) {
            ./tooling/run-host-checks.ps1 -Package $package
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

  flutter-host:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # Nothing here pushes: no token is left in .git/config.
          persist-credentials: false
      # cache: true keeps the SDK and its pub cache between runs.
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - shell: pwsh
        run: |
          flutter config --no-analytics
          ./tooling/run-host-checks.ps1 -Package apps/expense_tracker
      - name: Status and coverage by class and function
        # From the coverage the tests above wrote: the 現況 figures of
        # docs/roadmap.md, measured (bin/status.dart); then in the run's
        # summary every class and function under half covered, and fails when one no
        # test runs at all is new (tooling/architecture_checks/uncovered.txt
        # only shrinks). A file's average hides such a class.
        working-directory: apps/expense_tracker
        run: |
          (cd ../../tooling/architecture_checks && dart pub get --enforce-lockfile)
          dart run ../../tooling/architecture_checks/bin/status.dart
          dart run ../../tooling/architecture_checks/bin/declaration_coverage.dart
      - name: Screenshots
        # Every page, light and dark, at 360 dp (tool/screenshots), kept
        # with the run to look at a page without a phone.
        working-directory: apps/expense_tracker
        run: flutter test tool/screenshots
      - name: The emulator bench still compiles
        # integration_test is left out of the analysis above: only the
        # emulator workflow adds its package. Added here for a moment so a
        # change that breaks the bench fails the pull request instead of
        # the next emulator run (it went unnoticed for weeks once).
        working-directory: apps/expense_tracker
        run: |
          flutter pub add 'dev:integration_test:{"sdk":"flutter"}' \
            'dev:flutter_driver:{"sdk":"flutter"}'
          sed -i 's#^    - integration_test/\*\*#    \# - integration_test/**#; s#^    - test_driver/\*\*#    \# - test_driver/**#' \
            analysis_options.yaml
          flutter analyze integration_test test_driver
          git checkout -- pubspec.yaml pubspec.lock analysis_options.yaml
      - name: Keep the screenshots
        # v7.0.2.
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: screenshots
          path: apps/expense_tracker/build/screenshots
          if-no-files-found: error
          retention-days: 14
