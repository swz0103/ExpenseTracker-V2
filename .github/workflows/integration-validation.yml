name: V2 integration validation

# Keep the complete validation set on the single default delivery branch.
# Each push to main runs it once; the Android release (android.yml) waits
# for this run to pass instead of running its own copy.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'apps/**'
      - 'infrastructure/**'
      - 'packages/**'
      - 'tooling/**'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'apps/**'
      - 'infrastructure/**'
      - 'packages/**'
      - 'tooling/**'
  workflow_dispatch:

permissions:
  contents: read

# A push to main never cancels a validation that is already running; it
# waits for it. GitHub keeps only one waiting run per group, though: when
# several pushes land during one run, the older waiting ones are cancelled
# and only the newest is validated (and so published by android.yml), so a
# commit in the middle of a burst can be left without a result. Pull
# requests and manual runs each get a group of their own.
concurrency:
  group: v2-integration-validation-${{ github.event_name }}-${{ github.event_name == 'push' && github.ref || github.run_id }}
  cancel-in-progress: false

jobs:
  # Every pure Dart package in one job: one checkout, one SDK and one pub
  # cache instead of three.
  dart:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # Nothing here pushes: no token is left in .git/config.
          persist-credentials: false
      - name: The version never goes down
        # A pull request may keep the version: it is then merged without
        # being published, and waits for the next one that raises it
        # (docs/adr/0011-version-numbers.md). A version changed must go up.
        # Read from the API: nothing of main needs checking out.
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          version() { sed -n 's/^version: *\([0-9.]*\).*/\1/p'; }
          before=$(gh api "repos/$REPO/contents/apps/expense_tracker/pubspec.yaml?ref=$BASE" \
            --jq .content | base64 -d | version)
          now=$(version < apps/expense_tracker/pubspec.yaml)
          if [ "$now" = "$before" ]; then
            echo "Version stays at $now: merged without a release."
            exit 0
          fi
          higher=$(printf '%s\n%s\n' "$before" "$now" | sort -V | tail -1)
          if [ "$higher" != "$now" ]; then
            echo "::error::Version $now is lower than main's $before."
            exit 1
          fi
          echo "Version $before -> $now: published once merged."
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d
        with:
          sdk: '3.13.4'
      # v6.1.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-dart-3.13.4-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-dart-3.13.4-
      - shell: pwsh
        run: |
          $packages = @(
            'tooling/architecture_checks',
            'tooling/rules',
            'packages/core',
            'packages/domain',
            'packages/kernel',
            'packages/ledger/entries',
            'modules/loans',
            'packages/ledger/postings',
            'packages/ledger/trade_costs',
            'infrastructure/storage',
            'infrastructure/vault',
            'infrastructure/market'
          )
          foreach ($package in $packages) {
            ./tooling/run-host-checks.ps1 -Package $package
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: The rulebook
        # The rules as one runnable check (tooling/rules); its own tests ran
        # above with the package.
        run: dart run tooling/rules/bin/check.dart
      - name: Coverage floors
        # Line coverage the tests above wrote (coverage/lcov.info of each
        # package) must not fall below tooling/coverage_floors.json.
        run: |
          dart run tooling/architecture_checks/bin/check_coverage.dart \
            packages/core packages/domain packages/kernel \
            packages/ledger/entries \
            modules/loans packages/ledger/postings \
            packages/ledger/trade_costs \
            infrastructure/storage infrastructure/vault infrastructure/market

  flutter-host:
    runs-on: ubuntu-latest
    # Main's screenshots as well on a pull request: a few minutes more.
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # Nothing here pushes: no token is left in .git/config.
          persist-credentials: false
      # cache: true keeps the SDK and its pub cache between runs.
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Baseline and known defects
        # The behaviour recorded before the refactoring (test/baseline) and
        # the defects pinned as they are (test/known_defects): first, for a
        # quick answer; the full run below includes them again.
        working-directory: apps/expense_tracker
        run: |
          flutter config --no-analytics
          flutter pub get --enforce-lockfile
          flutter test test/baseline test/known_defects
      - name: Day ranges in other time zones
        # The runner keeps UTC, where a local midnight and a UTC midnight
        # are the same instant; a day compared as an instant only goes
        # wrong east of UTC (Taipei) or across a change of the clocks
        # (New York).
        working-directory: apps/expense_tracker
        run: |
          for zone in Asia/Taipei America/New_York; do
            TZ=$zone flutter test \
              test/features/import_export/ui/import_export_section_test.dart \
              test/features/entries/ui/entries_filter_sheet_test.dart
          done
      - name: Host checks, then the timing gates on their own
        # The suite without the timing gates at the default concurrency
        # (with coverage), then `flutter test --tags timing
        # --concurrency=1` without coverage: mandatory, and a host too busy
        # to judge them fails it here (CI is set), saying so.
        shell: pwsh
        run: |
          flutter config --no-analytics
          ./tooling/run-host-checks.ps1 -Package apps/expense_tracker
      - name: Status and coverage by class and function
        # From the coverage the tests above wrote: the 現況 figures of
        # docs/roadmap.md, measured (bin/status.dart); then in the run's
        # summary every class and function under half covered, and fails when one no
        # test runs at all is new (tooling/architecture_checks/uncovered.txt
        # only shrinks). A file's average hides such a class.
        working-directory: apps/expense_tracker
        run: |
          (cd ../../tooling/architecture_checks && dart pub get --enforce-lockfile)
          dart run ../../tooling/architecture_checks/bin/status.dart
          dart run ../../tooling/architecture_checks/bin/declaration_coverage.dart
          dart run ../../tooling/architecture_checks/bin/check_coverage.dart apps/expense_tracker
      - name: Screenshots
        # Every page, light and dark, at 360 dp (tool/screenshots), kept
        # with the run to look at a page without a phone.
        working-directory: apps/expense_tracker
        run: flutter test tool/screenshots
      - name: The emulator bench still compiles
        # integration_test is left out of the analysis above: only the
        # emulator workflow adds its package. Added here for a moment so a
        # change that breaks the bench fails the pull request instead of
        # the next emulator run (it went unnoticed for weeks once).
        working-directory: apps/expense_tracker
        run: |
          flutter pub add 'dev:integration_test:{"sdk":"flutter"}' \
            'dev:flutter_driver:{"sdk":"flutter"}'
          sed -i 's#^    - integration_test/\*\*#    \# - integration_test/**#; s#^    - test_driver/\*\*#    \# - test_driver/**#' \
            analysis_options.yaml
          flutter analyze integration_test test_driver
          git checkout -- pubspec.yaml pubspec.lock analysis_options.yaml
      - name: Keep the screenshots
        # v7.0.2.
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: screenshots
          path: apps/expense_tracker/build/screenshots
          if-no-files-found: error
          retention-days: 14
      - name: Screenshots that changed
        # On a pull request, the same pages drawn by main's code, compared
        # file by file (they are drawn the same to the byte when nothing
        # changed): the pages that look different are listed in the run's
        # summary, each before and after kept with the run, so a visual
        # change is seen and none slips in unnoticed. A list, not a gate:
        # changing how a page looks is allowed.
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$BASE"
          git worktree add "$RUNNER_TEMP/base" "$BASE"
          (cd "$RUNNER_TEMP/base/apps/expense_tracker" &&
            flutter pub get --enforce-lockfile > /dev/null &&
            flutter test tool/screenshots > /dev/null)
          before="$RUNNER_TEMP/base/apps/expense_tracker/build/screenshots"
          after=apps/expense_tracker/build/screenshots
          out=apps/expense_tracker/build/screenshot-changes
          mkdir -p "$out"
          changed=0
          {
            echo '### 畫面有改變的截圖'
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          # Names hold spaces ("01 總覽 light.png"): one per line.
          while IFS= read -r file; do
            if cmp -s "$before/$file" "$after/$file"; then continue; fi
            changed=$((changed + 1))
            name="${file%.png}"
            mkdir -p "$out/$name"
            if [ -f "$before/$file" ]; then cp "$before/$file" "$out/$name/before.png"; fi
            if [ -f "$after/$file" ]; then cp "$after/$file" "$out/$name/after.png"; fi
            echo "- $name" >> "$GITHUB_STEP_SUMMARY"
          done < <( (ls "$after"; ls "$before") | sort -u)
          if [ "$changed" -eq 0 ]; then
            echo '沒有，每張都和 main 相同。' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "共 $changed 張；改變前後在 artifact screenshot-changes。" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Keep the screenshots that changed
        if: github.event_name == 'pull_request'
        # v7.0.2.
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: screenshot-changes
          path: apps/expense_tracker/build/screenshot-changes
          if-no-files-found: ignore
          retention-days: 14

  # Rule C3: a pull request may add baseline files, but changing or deleting
  # one needs a `Baseline-Change: <reason>` line in a commit message.
  baseline-protection:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # The whole history: the diff and the log run against the base.
          fetch-depth: 0
          persist-credentials: false
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d
        with:
          sdk: '3.13.4'
      - name: Existing baseline files stay unless a commit says why
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          (cd tooling/architecture_checks && dart pub get --enforce-lockfile)
          dart run tooling/architecture_checks/bin/check_baseline_change.dart "$BASE"
