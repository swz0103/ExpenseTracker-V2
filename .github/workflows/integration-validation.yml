name: V2 integration validation

# Keep the complete validation set on the single default delivery branch.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'apps/**'
      - 'infrastructure/**'
      - 'packages/**'
      - 'tooling/**'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'apps/**'
      - 'infrastructure/**'
      - 'packages/**'
      - 'tooling/**'
  workflow_dispatch:
  # Release workflows call this first so a release only ships a SHA whose
  # whole validation set passed in the same run.
  workflow_call:

permissions:
  contents: read

# Pushes to one ref queue instead of cancelling, so every commit on main
# keeps a result; release and manual runs run on their own. When another
# workflow calls this one, github.workflow is the caller's name, which
# keeps the call out of the standalone run's queue.
concurrency:
  group: v2-integration-validation-${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'push' && github.ref || github.run_id }}
  cancel-in-progress: false

jobs:
  architecture:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d
        with:
          sdk: '3.13.4'
      - shell: pwsh
        run: ./tooling/run-host-checks.ps1 -Package tooling/architecture_checks

  domain:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d
        with:
          sdk: '3.13.4'
      - shell: pwsh
        run: |
          $packages = @(
            'packages/core',
            'packages/domain'
          )
          foreach ($package in $packages) {
            ./tooling/run-host-checks.ps1 -Package $package
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

  storage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d
        with:
          sdk: '3.13.4'
      - shell: pwsh
        run: |
          $packages = @(
            'infrastructure/storage',
            'infrastructure/vault',
            'infrastructure/market'
          )
          foreach ($package in $packages) {
            ./tooling/run-host-checks.ps1 -Package $package
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

  flutter-host:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - shell: pwsh
        run: |
          flutter config --no-analytics
          ./tooling/run-host-checks.ps1 -Package apps/expense_tracker
