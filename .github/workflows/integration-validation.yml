name: V2 integration validation

# Keep the complete validation set on the single default delivery branch.
# Each push to main runs it once; the Android release (android.yml) waits
# for this run to pass instead of running its own copy.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'apps/**'
      - 'infrastructure/**'
      - 'packages/**'
      - 'tooling/**'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'apps/**'
      - 'infrastructure/**'
      - 'packages/**'
      - 'tooling/**'
  workflow_dispatch:

permissions:
  contents: read

# A push to main never cancels a validation that is already running; it
# waits for it. GitHub keeps only one waiting run per group, though: when
# several pushes land during one run, the older waiting ones are cancelled
# and only the newest is validated (and so published by android.yml), so a
# commit in the middle of a burst can be left without a result. Pull
# requests and manual runs each get a group of their own.
concurrency:
  group: v2-integration-validation-${{ github.event_name }}-${{ github.event_name == 'push' && github.ref || github.run_id }}
  cancel-in-progress: false

jobs:
  # Every pure Dart package in one job: one checkout, one SDK and one pub
  # cache instead of three.
  dart:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d
        with:
          sdk: '3.13.4'
      # v4.3.0
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-dart-3.13.4-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-dart-3.13.4-
      - shell: pwsh
        run: |
          $packages = @(
            'tooling/architecture_checks',
            'packages/core',
            'packages/domain',
            'infrastructure/storage',
            'infrastructure/vault',
            'infrastructure/market'
          )
          foreach ($package in $packages) {
            ./tooling/run-host-checks.ps1 -Package $package
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

  flutter-host:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      # cache: true keeps the SDK and its pub cache between runs.
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - shell: pwsh
        run: |
          flutter config --no-analytics
          ./tooling/run-host-checks.ps1 -Package apps/expense_tracker
