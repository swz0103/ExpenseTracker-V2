# Registry of single sources (rule B1): for each thing the app must decide
# in exactly one place, who owns it today and where it should live.
#
#   id      kebab-case, unique
#   what    short, Traditional Chinese
#   layer   core | ledger | app | design_system | data
#   owner   paths in the repo that implement it today (list; empty if none)
#   target  path in the approved target architecture (folders, not files)
#   status  owned      exactly the listed owner implements it today
#           scattered  implemented in several places today
#           planned    does not exist yet
#   guard   (optional) what keeps it single: rule ids of tooling/rules
#           (B9-...) or test files (paths from the repo root); every owner
#           a work package touches names one
#   plan    (scattered only, required) one line: how it becomes owned
#
# Statuses were set by reading the file names and a few call sites, not by
# a full audit; where unsure they say `scattered`.
items:
  # ---- core ----
  - id: money-amount
    what: 金額的解析、進位、正負
    layer: core
    owner:
      - packages/core/lib/money/
    target: packages/core/lib/money/
    status: owned
  - id: currency-fx
    what: 幣別與匯率換算（含用哪一天的匯率）
    layer: core
    owner:
      - packages/core/lib/src/foundation_values/fx.dart
      - apps/expense_tracker/lib/src/core/ledger/repositories/market_data_repository.dart
      - apps/expense_tracker/lib/src/core/ledger/models/fixed_point.dart
    target: packages/core/lib/fx/
    status: scattered
    plan: "D58: one dated FX and price table in packages/core/lib/fx; market_data_repository reads it, fixed_point keeps only the arithmetic."
  # Decision D59: a foreign balance held is valued at the bank's buying
  # rate, one owed at its selling rate; valuationSide is the one rule,
  # MarketDataReader.valueAtHome and the journal's valuer ask it.
  - id: fx-valuation-side
    what: 外幣餘額用銀行買入價或賣出價估值
    layer: core
    owner:
      - packages/core/lib/src/foundation_values/fx.dart
    target: packages/core/lib/fx/
    status: owned
  - id: ratio-rounding
    what: 百分比與比例的進位
    layer: core
    owner:
      - packages/core/lib/percent/
    target: packages/core/lib/percent/
    status: owned
  # Reports and budgets keep their own periods (a quarter, a chosen run
  # of months) but count months and days with core's YearMonth.
  # Full-width digits and signs typed on a Chinese keyboard, read as
  # ASCII by the parsers that take them (D86).
  - id: typed-full-width
    what: 全形數字與符號的讀取
    layer: core
    owner:
      - packages/core/lib/money/typed_text.dart
    target: packages/core/lib/money/
    status: owned
  - id: dates-periods
    what: 日期、年月、期間範圍
    layer: core
    owner:
      - packages/core/lib/time/
    target: packages/core/lib/time/
    status: owned
  # The app holds the one clock at its composition level
  # (core/time/app_clock.dart) and asks core's Clock for "today".
  - id: clock-now
    what: 「今天」與現在時間
    layer: core
    owner:
      - packages/core/lib/time/clock.dart
      - apps/expense_tracker/lib/src/core/time/app_clock.dart
    target: packages/core/lib/time/
    status: owned
  - id: holidays-business-days
    what: 假日與營業日順延
    layer: core
    owner:
      - packages/core/lib/time/holidays/
    target: packages/core/lib/time/
    status: owned
  # Decision D33: a guard test fails holidayTableLeadDays (60) before the
  # office or market table runs out, naming the file to extend.
  - id: holiday-table-coverage
    what: 假日表涵蓋期限檢查（到期前 60 天）
    layer: core
    owner:
      - packages/core/lib/time/holidays/coverage.dart
    target: packages/core/lib/time/
    status: owned
  # A day held as the app holds days: a DateTime at UTC midnight (dayOf).
  # Rule B4 keeps hand-made copies out.
  - id: utc-day
    what: 把時刻或日期取成「那一天」（UTC 午夜）
    layer: core
    owner:
      - packages/core/lib/time/utc_days.dart
    target: packages/core/lib/time/
    status: owned
  # Month ends, steps and counts (monthEnd, monthStart, monthStarts,
  # monthIndex, shiftMonth; a day moved by months held to the month's
  # last day: addMonthsClamped, monthsAfter); rule B4.
  - id: month-arithmetic
    what: 月底、前後幾個月、逐月、相差幾個月
    layer: core
    owner:
      - packages/core/lib/time/month_arithmetic.dart
      - packages/core/lib/time/utc_days.dart
    target: packages/core/lib/time/
    status: owned
  # Reports' 去年同期: 29 February becomes the 28th.
  - id: same-day-last-year
    what: 去年的同一天（2/29 變 2/28）
    layer: core
    owner:
      - packages/core/lib/time/utc_days.dart
    target: packages/core/lib/time/
    status: owned
  # minYear/maxYear; rule B5 keeps 9999 out of other files.
  - id: calendar-year-range
