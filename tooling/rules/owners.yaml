    layer: ledger
    owner:
      - packages/ledger/entries/lib/rules
    target: packages/ledger/entries/lib/rules/
    status: owned
  # Decision D25: an entry dated after today is 預定; every "as of today"
  # sum (balances, net worth, budgets, overview, reports, card bills) asks
