  # and merchants, a card's sums, the usual ones and the holdings too
  # (D71); apps/expense_tracker/test/rules/as_of_today_rules_test.dart
  # finds a read of the entries in lib that goes past countedOn.
  - id: as-of-today
    what: 「截至今天」是否計入（預定紀錄）與可預定的天數上限
    layer: ledger
    owner:
      - packages/ledger/entries/lib/model/planned.dart
    target: packages/ledger/entries/lib/model/
    status: owned
  # Decision D52: cashback, an annual fee and an e-invoice are known by
