  - id: refund-share
    what: 退款沖回原消費的台幣金額、分攤與標籤
    layer: ledger
    owner:
      - packages/ledger/entries/lib/rules/refund_rules.dart
    target: packages/ledger/entries/lib/rules/
    status: owned
  - id: income-expense-kinds
    what: 什麼算「支出」「收入」
    layer: ledger
    owner:
      - packages/ledger/entries/lib/model/entry.dart
    target: packages/ledger/entries/lib/rules/
    status: scattered
    plan: "One table of which entry types count as spending or income (refunds included) in packages/ledger/entries/lib/rules, read by reports, budgets and the widget."
