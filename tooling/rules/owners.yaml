  - id: journal-accounts-scale
    what: 帳戶類別、是否計入淨值／收支、數量刻度
    layer: ledger
    owner:
      - packages/kernel/lib/model/accounts.dart
      - packages/kernel/lib/model/quantity.dart
    target: packages/kernel/lib/model/
    status: owned
  # Each kind's posting rule, the two amenders (foreign value,
