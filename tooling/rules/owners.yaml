# Registry of single sources (rule B1): for each thing the app must decide
# in exactly one place, who owns it today and where it should live.
#
#   id      kebab-case, unique
#   what    short, Traditional Chinese
#   layer   core | ledger | app | design_system | data
#   owner   paths in the repo that implement it today (list; empty if none)
#   target  path in the approved target architecture (folders, not files)
#   status  owned      exactly the listed owner implements it today
#           scattered  implemented in several places today
#           planned    does not exist yet
#
# Statuses were set by reading the file names and a few call sites, not by
# a full audit; where unsure they say `scattered`.
items:
  # ---- core ----
  - id: money-amount
    what: 金額的解析、進位、正負
    layer: core
    owner:
      - packages/core/lib/src/foundation_values/money.dart
      - apps/expense_tracker/lib/src/core/ledger/models/fixed_point.dart
      - apps/expense_tracker/lib/src/core/formatting/amounts.dart
    target: packages/core/lib/money/
    status: scattered
  - id: currency-fx
    what: 幣別與匯率換算（含用哪一天的匯率）
