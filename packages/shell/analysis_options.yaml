# As the app's: Flutter's recommended lints, stricter casts and types.
include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
  language:
    strict-casts: true
    strict-raw-types: true
linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - cancel_subscriptions
    - close_sinks
    - only_throw_errors
    - prefer_final_fields
    - test_types_in_equals
    - unawaited_futures
    - comment_references
