name: expense_tracker
description: "記帳本：個人記帳 Android App。"
publish_to: 'none'
version: 0.2.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  # Material's own words (date and time pickers, the copy and paste
  # menu) in Traditional Chinese.
  flutter_localizations:
    sdk: flutter
  core:
    path: ../../packages/core
  domain:
    path: ../../packages/domain
  market:
    path: ../../infrastructure/market
  storage:
    path: ../../infrastructure/storage
  vault:
    path: ../../infrastructure/vault

dev_dependencies:
  flutter_test:
    sdk: flutter

hooks:
  user_defines:
    sqlite3:
      source: sqlcipher

flutter:
  uses-material-design: true
  fonts:
    # Nunito for numbers and Latin text, Noto Sans TC (Adobe's Source
    # Han Sans, Traditional Chinese) for Chinese; both under the SIL
    # Open Font License (fonts/OFL-*.txt). Noto Sans TC's own weights
    # keep Chinese words crisp at small sizes instead of the system
    # faking a bold out of one borrowed weight.
    - family: Nunito
      fonts:
        - asset: fonts/Nunito-Regular.ttf
        - asset: fonts/Nunito-SemiBold.ttf
          weight: 600
        - asset: fonts/Nunito-Bold.ttf
          weight: 700
    - family: NotoSansTC
      fonts:
        - asset: fonts/NotoSansTC-Regular.ttf
        - asset: fonts/NotoSansTC-Bold.ttf
          weight: 700
