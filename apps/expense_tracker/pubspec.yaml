name: expense_tracker
description: "記帳本 V2：建立在 app_core 與 bookkeeping 上的新 App（階段 4）。"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  accounts:
    path: ../../packages/accounts
  app_core:
    path: ../../packages/app_core
  backup_security:
    path: ../../infrastructure/backup_security
  bookkeeping:
    path: ../../packages/bookkeeping
  foundation_values:
    path: ../../packages/foundation_values
  ledger:
    path: ../../packages/ledger
  ledger_sqlcipher:
    path: ../../infrastructure/ledger_sqlcipher
  ledger_vault:
    path: ../../infrastructure/ledger_vault
  reports:
    path: ../../packages/reports

dev_dependencies:
  flutter_test:
    sdk: flutter

hooks:
  user_defines:
    sqlite3:
      source: sqlcipher

flutter:
  uses-material-design: true
  fonts:
    # Nunito for numbers and Latin text, Huninn (jf 粉圓) for Chinese;
    # both under the SIL Open Font License (fonts/OFL-*.txt).
    - family: Nunito
      fonts:
        - asset: fonts/Nunito-Regular.ttf
        - asset: fonts/Nunito-SemiBold.ttf
          weight: 600
        - asset: fonts/Nunito-Bold.ttf
          weight: 700
    - family: Huninn
      fonts:
        - asset: fonts/Huninn-Regular.ttf
